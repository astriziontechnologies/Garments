<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" fill="none">
  <rect width="600" height="450" fill="#F1F5F9"/>
  <!-- Building base -->
  <rect x="120" y="200" width="360" height="180" fill="#CBD5E1"/>
  <!-- Roof -->
  <polygon points="100,200 300,100 500,200" fill="#94A3B8"/>
  <!-- Door -->
  <rect x="255" y="300" width="90" height="80" rx="4" fill="#64748B"/>
  <circle cx="258" cy="340" r="5" fill="#CBD5E1"/>
  <!-- Windows -->
  <rect x="145" y="240" width="70" height="60" rx="4" fill="#BAE6FD"/>
  <rect x="385" y="240" width="70" height="60" rx="4" fill="#BAE6FD"/>
  <!-- Window cross bars -->
  <line x1="180" y1="240" x2="180" y2="300" stroke="#94A3B8" stroke-width="2"/>
  <line x1="145" y1="270" x2="215" y2="270" stroke="#94A3B8" stroke-width="2"/>
  <line x1="420" y1="240" x2="420" y2="300" stroke="#94A3B8" stroke-width="2"/>
  <line x1="385" y1="270" x2="455" y2="270" stroke="#94A3B8" stroke-width="2"/>
  <!-- Sign board -->
  <rect x="200" y="155" width="200" height="35" rx="4" fill="#3B82F6"/>
  <text x="300" y="178" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">SRI GARMENTS</text>
  <!-- Ground -->
  <rect x="0" y="380" width="600" height="70" fill="#E2E8F0"/>
  <!-- Path -->
  <rect x="230" y="380" width="140" height="70" fill="#CBD5E1"/>
  <text x="300" y="430" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#94A3B8">Our Store</text>
</svg>
